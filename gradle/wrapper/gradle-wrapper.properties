# NowWeather 构建用 Gradle 发行包
#
# 注意：Gradle 官方源 services.gradle.org 在国内经常被网络策略拦截
# （表现为 "PKIX path building failed: unable to find valid certification path"），
# 所以这里默认使用腾讯云镜像。海外用户可以改回官方源：
#   distributionUrl=https\://services.gradle.org/distributions/gradle-7.5.1-bin.zip
#
# 为什么固定在 7.5.1：ForgeGradle 5.1.x（Forge 1.18.x 的官方构建插件）要求 Gradle 7.5 及以上。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-7.5.1-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
