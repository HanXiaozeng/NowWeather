# ---- NowWeather 构建属性 ----
# 注意：本文件保持「机器无关」。本机 JDK 路径请写进 ~/.gradle/gradle.properties，
# 例如： org.gradle.java.installations.paths=D:\\jdk-17

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false

# 构建时用的 Java：Gradle 7.5.1 只能跑在 Java 8~18 上，因此需要 JDK 17/18 来启动 Gradle。
# 若 JAVA_HOME 不是 17/18，请用 -Dorg.gradle.java.home=... 或 gradle.properties(用户级) 指定。

# 版本号规则：<年份后两位>b<当年第几周><小写字母 = 本周第几次修改>
# 其中 b = build（构建）。字母是「本周第几次」：a = 第 1 次、f = 第 6 次。
# 例：26b39i = 2026 年第 39 周的第 6 次构建。
mod_version=26b39i
mod_id=nowweather
mod_name=NowWeather
mod_authors=Cluda
mod_description=用真实天气驱动 Minecraft：UApiPro 实时天气 + 生物群系气候映射 + 多天气模组联动。

# ---- 首要目标版本 ----
minecraft_version_1182=1.18.2
forge_version_1182=40.3.11
mappings_1182=official
minecraft_version_1181=1.18.1
forge_version_1181=39.1.2
mappings_1181=official

